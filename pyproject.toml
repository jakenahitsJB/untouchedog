[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "contact-parser"
version = "1.0.0"
description = "Standalone cross-platform USA contact parser for emails and NANP phone numbers"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Developer" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Environment :: Console",
    "Topic :: Utilities"
]
dependencies = []

[project.scripts]
contact-parser = "parser:main"

[tool.setuptools]
py-modules = ["parser"]
